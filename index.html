<script>
/* Aspetto dell'azienda: nome, i due colori della sfumatura, logo d'apertura e logo in alto nella Home.
   Valori di base: quelli di NM_ASPETTO in config.js (il sito di ogni azienda ha il suo), altrimenti un aspetto neutro.
   Quelli scelti dall'amministratore (Altro › Aspetto, salvati in impostazioni/aspetto) vincono e restano
   anche sul dispositivo, così la schermata d'avvio è giusta già prima di entrare. */
window.NM_MARCA = (function () {
  // loghi neutri: una barca stilizzata con il nome dell'azienda scritto accanto (finché non se ne carica uno)
  var BARCA = '<path d="M30 6 V58 H4 Z" fill="#E6EEF6"/><path d="M36 14 Q58 34 54 58 H36 Z" fill="#2EC4B6"/><path d="M0 64 H70 L60 78 H10 Z" fill="#E6EEF6"/><path d="M-4 88 Q8 82 20 88 T44 88 T68 88" fill="none" stroke="#2EC4B6" stroke-width="4" stroke-linecap="round"/>';
  function xml(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]; }); }
  function svgUrl(s) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
  function logoNeutro(nome) {
    var t = String(nome).toUpperCase(), fs = Math.max(22, Math.min(52, 520 / (t.length * .68)));
    return svgUrl('<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160"><g transform="translate(40 30) scale(1.1)">' + BARCA + '</g>' +
      '<text x="150" y="' + (80 + fs * .35) + '" font-family="Helvetica,Arial,sans-serif" font-size="' + fs.toFixed(1) + '" font-weight="700" fill="#E6EEF6" letter-spacing="2">' + xml(t) + '</text></svg>');
  }
  function scrittaNeutra(nome) {
    var t = String(nome), fs = Math.max(18, Math.min(34, 440 / (t.length * .56))), w = 62 + t.length * fs * .56, x = Math.max(0, (600 - w) / 2);
    return svgUrl('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="72" viewBox="0 0 600 72"><g transform="translate(' + x.toFixed(0) + ' 2) scale(.7)">' + BARCA + '</g>' +
      '<text x="' + (x + 62).toFixed(0) + '" y="' + (36 + fs * .38).toFixed(1) + '" font-family="Helvetica,Arial,sans-serif" font-size="' + fs.toFixed(1) + '" font-weight="700" fill="#E6EEF6">' + xml(t) + '</text></svg>');
  }
  var DEF = { nome: 'Gestionale Rimessaggio', colore1: '#263442', colore2: '#0D131A' };
  var CSS1 = '#16304F', CSS2 = '#06002E', KEY = 'nm-aspetto', db = null, cur = {}; // CSS1/CSS2: i colori scritti nel foglio di stile
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { db = null; }
  function hex(c) { c = String(c || '').trim(); return /^#[0-9a-f]{6}$/i.test(c) ? c.toUpperCase() : ''; }
  function rgb(c) { return [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }); }
  function out(a) { return '#' + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join('').toUpperCase(); }
  function mix(a, b, t) { var x = rgb(a), y = rgb(b); return out(x.map(function (v, i) { return v * t + y[i] * (1 - t); })); }
  function scale(a, k) { return out(rgb(a).map(function (v) { return v * k; })); }
  function luce(c) { var x = rgb(c); return (.2126 * x[0] + .7152 * x[1] + .0722 * x[2]) / 255; }
  // le scritte dell'app sono chiare: un colore troppo chiaro viene scurito quanto basta per leggerle
  function scuro(c, max) { var l = luce(c); return l > max ? scale(c, max / l) : c; }
  function colori(c1, c2) {
    var W = '#FFFFFF', mid = mix(c1, c2, .55);
    return {
      '--bg': c2, '--bar': c2, '--brand': c2, '--card': scale(c1, .77), '--card-2': mix(c1, W, .985), '--cell': mix(c1, W, .985),
      '--cell-out': scale(c1, .55), '--line': mix(c1, W, .97), '--track': mix(c1, W, .97), '--edge': mix(c1, W, .965), '--c1': c1, '--c-mid': mid,
      '--fade': 'linear-gradient(180deg, ' + c1 + ' 0%, ' + mid + ' 55%, ' + c2 + ' 100%)',
      '--body-bg': 'radial-gradient(110% 55% at 50% 0%, ' + mix(c1, W, .98) + ' 0%, ' + mix(c1, c2, .3) + ' 45%, ' + c2 + ' 75%)',
      '--map-bg': 'radial-gradient(ellipse 60% 75% at 50% 48%, ' + mix(c1, W, .98) + ' 0%, ' + mid + ' 45%, ' + c2 + ' 100%)',
      '--feat-bg': 'linear-gradient(135deg, ' + scale(c1, 1.45) + ' 0%, ' + mix(c1, c2, .4) + ' 60%, ' + c2 + ' 100%)',
      '--search-bg': scale(c1, .64), '--dblock-bg': 'linear-gradient(180deg, ' + mix(c1, W, .95) + ', ' + scale(c1, .85) + ')', '--pop-line': mix(c1, W, .92)
    };
  }
  function conf() {
    var b = window.NM_ASPETTO || {}, d = db || {}, r = {};
    ['nome', 'colore1', 'colore2', 'logo', 'scritta'].forEach(function (k) { r[k] = d[k] || b[k] || DEF[k] || ''; });
    // il luogo del meteo va preso tutto insieme (nome e coordinate) dalla stessa fonte
    var lp = typeof d.lat === 'number' && typeof d.lon === 'number' ? d : typeof b.lat === 'number' && typeof b.lon === 'number' ? b : {};
    r.luogo = lp.luogo || ''; r.lat = typeof lp.lat === 'number' ? lp.lat : null; r.lon = typeof lp.lon === 'number' ? lp.lon : null; r.sigla = lp === b ? b.sigla || '' : '';
    r.colore1 = scuro(hex(r.colore1) || DEF.colore1, .2); r.colore2 = scuro(hex(r.colore2) || DEF.colore2, .06);
    r.nome = String(r.nome).trim().slice(0, 60) || DEF.nome;
    if (!r.logo) r.logo = logoNeutro(r.nome);
    if (!r.scritta) r.scritta = scrittaNeutra(r.nome);
    return r;
  }
  function img(id, src) {
    var el = document.getElementById(id); if (!el) return;
    if (el.getAttribute('src') !== src) el.setAttribute('src', src);
    el.alt = id === 'logo-src' ? cur.nome : ''; if (el.parentNode && el.parentNode.id === 'splash') el.parentNode.setAttribute('aria-label', cur.nome);
  }
  function applica() {
    cur = conf();
    var st = document.documentElement.style, v = colori(cur.colore1, cur.colore2), base = cur.colore1 === CSS1 && cur.colore2 === CSS2;
    // con i colori scritti nel foglio di stile (quelli di Nautica Mare) resta com'è, identico a prima
    Object.keys(v).forEach(function (k) { if (base) st.removeProperty(k); else st.setProperty(k, v[k]); });
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) { if (!tc.hasAttribute('data-orig')) tc.setAttribute('data-orig', tc.content); tc.content = base ? tc.getAttribute('data-orig') : cur.colore2; }
    document.title = cur.nome + ' – Gestionale cantiere';
    var at = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (at) at.content = cur.nome; // nome dell'app aggiunta alla Home dell'iPhone
    img('logo-src', cur.logo); img('scritta-src', cur.scritta);
    try { document.dispatchEvent(new CustomEvent('nm-marca')); } catch (e) { }
  }
  applica();
  return {
    DEF: DEF, hex: hex, colori: colori, scuro: scuro,
    nome: function () { return cur.nome; },
    get: function () { return cur; },
    logo: function () { var el = document.getElementById('logo-src'); return el ? el.getAttribute('src') : ''; },
    // nuove scelte dal database (o null = nessuna): si applicano e si ricordano sul dispositivo
    dalDatabase: function (d) {
      var n = d && !d._del ? { nome: d.nome || '', colore1: d.colore1 || '', colore2: d.colore2 || '', logo: d.logo || '', scritta: d.scritta || '',
        luogo: d.luogo || '', lat: typeof d.lat === 'number' ? d.lat : null, lon: typeof d.lon === 'number' ? d.lon : null } : null;
      if (JSON.stringify(n) === JSON.stringify(db)) return false;
      db = n; try { if (n) localStorage.setItem(KEY, JSON.stringify(n)); else localStorage.removeItem(KEY); } catch (e) { }
      applica(); return true;
    },
    // anteprima di scelte non ancora salvate (Altro › Aspetto); applica() torna a quelle salvate
    prova: function (d) { var keep = db; db = Object.assign({}, db || {}, d); applica(); db = keep; },
    applica: applica
  };
})();
</script>

<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Tema «Blu notte»: blu che sfuma nel navy del logo, titoli in Space Grotesk, testo in IBM Plex Sans. Layout: app scura a schermo pieno — barra in alto, sezioni con titolo e link "Vedi tutto", riquadri a due colonne con indicatori ad anello, calendario mensile a celle con barre colorate, barra a 5 sezioni in basso */
:root {
  color-scheme: dark;
  --bg: #06002E;
  --bar: #06002E;
  --card: #11223A;
  --card-2: #1A3150;
  --cell: #1A3150;
  --cell-out: #0C1A2C;
  --line: #1D3555;
  --track: #1D3555;
  --ink: #EAF2FB;
  --muted: #93A8C2;
  --dim: #5B7393;
  --accent: #2EC4B6;
  --accent-ink: #03201D;
  --late: #FF6B5E; --soon: #FFB547; --ok: #4ADE9B;
  --late-bg: rgba(255, 107, 94, .17); --soon-bg: rgba(255, 181, 71, .16); --ok-bg: rgba(74, 222, 155, .15); --accent-bg: rgba(46, 196, 182, .15);
  --vio: #A78BFA; --vio-bg: rgba(167, 139, 250, .18);
  --brand: #06002E;
  --scrim: rgba(3, 0, 24, .66);
  --fade: linear-gradient(180deg, #16304F 0%, #0D1A3C 55%, #06002E 100%);
  /* i due colori della sfumatura e i fondi che ne derivano: l'amministratore li può cambiare (Altro › Aspetto) */
  --c1: #16304F;
  --c-mid: #0D1A3C;
  --body-bg: radial-gradient(110% 55% at 50% 0%, #14305C 0%, #0A0B3A 45%, #06002E 75%);
  --map-bg: radial-gradient(ellipse 60% 75% at 50% 48%, #1A2E5C 0%, #0D1A3C 45%, #06002E 100%);
  --feat-bg: linear-gradient(135deg, #1A4672 0%, #101E48 60%, #06002E 100%);
  --search-bg: #0E1E34;
  --dblock-bg: linear-gradient(180deg, #1E3A5E, #132842);
  --pop-line: #23406A;
  --edge: #1C3758;
  --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Space Grotesk", "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px;
}
html, body { min-height: 100%; background: var(--bg); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Barra in alto */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar);
  display: grid; grid-template-columns: minmax(42px, max-content) minmax(0, 1fr) minmax(96px, max-content); align-items: center;
  padding: 8px 8px; min-height: 54px;
}
.top .l { display: flex; justify-content: flex-start; gap: 4px; }
.top .r { display: flex; justify-content: flex-end; gap: 4px; }
.top .icon-btn.help { width: 32px; color: var(--muted); }
.top .r:has(.help + .icon-btn + .icon-btn) { gap: 0; }
.top .icon-btn.help svg { width: 23px; height: 23px; }
/* guida: niente si restringe, la finestra scorre fino in fondo (senza, l’elenco delle sezioni spariva sugli schermi bassi) */
.sheet-body.gd > * { flex-shrink: 0; }
.gd-p { margin: 0; color: var(--ink); }
.gd-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 9px; color: var(--muted); }
.top h1 { margin: 0; text-align: center; font-size: 1.05rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn {
  position: relative; width: 42px; height: 42px; border: 0; background: none; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
}
.icon-btn svg { width: 25px; height: 25px; }
.icon-btn.blue { color: var(--accent); }
.icon-btn .dot {
  position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--late); color: #fff; font-size: .68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

.app { max-width: 720px; margin: 0 auto; padding-inline: 14px; padding-block: 4px calc(100px + env(safe-area-inset-bottom, 0px)); }

/* Sezioni */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 26px 2px 12px; }
.sec-h h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
.link { border: 0; background: none; color: var(--accent); font-size: .95rem; padding: 4px 0; white-space: nowrap; }

/* Bottoni */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 8px 16px; border-radius: 6px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .92rem; white-space: nowrap;
}
.btn.sec { background: var(--card-2); color: var(--ink); }
.btn.danger { background: var(--late); color: #fff; }
.btn.danger-ghost { background: transparent; color: var(--late); box-shadow: inset 0 0 0 1.5px var(--late); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 17px; height: 17px; }
.mini { border: 0; background: var(--card-2); color: var(--accent); font-size: .78rem; font-weight: 650; padding: 4px 9px; border-radius: 6px; margin-left: 8px; }

/* Carosello in primo piano */
.feat { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -14px; scrollbar-width: none; }
.feat::-webkit-scrollbar { display: none; }
.feat-w { flex: 0 0 100%; padding-inline: 14px; scroll-snap-align: start; min-width: 0; }
.feat-card { background: var(--card); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
.feat-top { display: flex; gap: 12px; align-items: flex-start; }
.ic-circle { flex: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; }
.ic-circle svg { width: 22px; height: 22px; }
.ic-circle.late { background: var(--late); } .ic-circle.soon { background: var(--soon); } .ic-circle.ok { background: var(--ok); }
.feat-title { font-size: 1.3rem; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
.feat-sub { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.feat-status { font-size: .95rem; font-weight: 600; }
.feat-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.dots { display: flex; justify-content: center; gap: 7px; margin-top: 12px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.dots i.on { background: var(--ink); }

/* Riquadri In breve */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  background: var(--card); border: 0; border-radius: var(--r); padding: 12px 12px 14px; min-width: 0;
  display: flex; flex-direction: column; gap: 8px; text-align: left; color: var(--ink);
}
button.tile:active { background: var(--card-2); }
.tile-h { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 500; line-height: 1.2; }
.tile-h svg { width: 17px; height: 17px; flex: none; display: block; }
.tile .gauge, .tile .ring { width: 100%; max-width: 116px; align-self: center; display: block; }
.g-num { fill: var(--ink); font: 500 25px var(--font-body); font-variant-numeric: tabular-nums; }
.g-sub { fill: var(--muted); font: 500 10px var(--font-body); }
.big { font-size: 1.55rem; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font-size: .9rem; color: var(--muted); font-weight: 500; }
.cap { font-size: .82rem; color: var(--muted); line-height: 1.3; }
.t-late { color: var(--late); } .t-soon { color: var(--soon); } .t-ok { color: var(--ok); } .t-acc { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack b { display: block; font-size: 1.45rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.stack span { display: block; font-size: .8rem; color: var(--muted); margin-top: 3px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.week span { display: flex; align-items: center; justify-content: center; height: 18px; }
.week span.today { color: var(--ink); font-weight: 700; }
.week span.done { color: var(--ink); }
.week svg { width: 13px; height: 13px; }
.bars { width: 100%; height: auto; display: block; }
.axis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: -2px; }

/* Liste */
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; }
.group > .row + .row, .group > .kv-row + .kv-row { border-top: 1px solid var(--line); }
button.row, .row .hit { width: 100%; border: 0; background: none; text-align: left; color: var(--ink); }
.row .hit { display: flex; align-items: center; gap: 12px; padding: 0; flex: 1; min-width: 0; }
button.row:active, .row .hit:active { opacity: .65; }
.main { flex: 1; min-width: 0; }
.title, .sub, .status { display: block; }
.title { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: .86rem; line-height: 1.35; overflow-wrap: anywhere; margin-top: 2px; }
.status { font-size: .86rem; font-weight: 600; margin-top: 3px; }
.status.late { color: var(--late); } .status.soon { color: var(--soon); } .status.ok { color: var(--ok); }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.amount { font-size: .86rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.dblock {
  flex: none; width: 50px; height: 52px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--card-2); color: var(--ink); text-align: center;
}
.dblock b { font-size: 1.25rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.dblock b.sm { font-size: .9rem; }
.dblock small { font-size: .64rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-top: 4px; color: inherit; opacity: .85; }
.dblock.late { background: var(--late-bg); color: var(--late); }
.dblock.soon { background: var(--soon-bg); color: var(--soon); }
.dblock.ok { background: var(--ok-bg); color: var(--ok); }
.chk {
  flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--card-2); color: var(--ink);
  font-size: .82rem; font-weight: 600; padding: 8px 10px; border-radius: 6px; min-height: 36px;
}
.chk svg { width: 15px; height: 15px; color: var(--ok); }
.chk.on { background: var(--ok-bg); color: var(--ok); }
.pan-bars { padding: 6px 14px; }
.pan-bar { display: grid; grid-template-columns: minmax(0, 38%) 1fr auto; align-items: center; gap: 10px; padding: 7px 0; font-size: .88rem; }

.don { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0 10px; }
.g2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

        h += '<form class="me-card" id="nome-form" autocomplete="off"><div class="main"><span class="title">Come vuoi comparire nella scheda?</span><span class="sub">È il nome che vedono i colleghi accanto alle tue ore. Puoi cambiarlo quando vuoi.</span></div>' +
          '<div class="nome-row"><input id="nome-in" type="text" value="' + esc(draft) + '" placeholder="es. Melani" autocapitalize="words" aria-label="Il tuo nome nella scheda"><button type="submit" class="btn">Salva</button></div></form>';
      } else {
        h += '<div class="me-card">' + avatar(S.myId) + '<div class="main"><span class="title">' + esc(nameOf(S.myId)) + '</span><span class="sub">Le mansioni che aggiungi vengono segnate con questo nome</span></div>' +
          (S.canWrite ? '<button type="button" class="link" data-act="edit-nome">Cambia</button>' : '') + '</div>';
      }
    }
    h += '<div class="cal-nav" style="margin-top:14px"><button type="button" class="icon-btn blue" data-act="sd-prev" aria-label="Giorno precedente">' + I.left + '</button><h2 class="day-t">' + esc(day === today ? 'Oggi, ' + fmtDayLong(day) : cap(fmtDayLong(day))) + '</h2><button type="button" class="icon-btn blue" data-act="sd-next" aria-label="Giorno successivo">' + I.right + '</button></div>';
    if (day !== today) h += '<div class="center"><button type="button" class="link" data-act="sd-today">Torna a oggi</button></div>';

    var all = entriesOn(day, true);
    function changed(list) { return list.some(function (l) { return l.annullata || l.modDopoConferma || l.aggiuntaDopoConferma; }); }
    if (S.myId) {
      var myAll = all.filter(function (l) { return l.utente === S.myId; }), my = myAll.filter(function (l) { return !l.annullata; });
      var conf = isConfirmed(S.myId, day), future = day > today, acts = '';
      if (S.canWrite) {
        acts += '<button type="button" class="btn" data-act="new-entry">' + I.plus + 'Mansione</button>';
        if (!crMine() && day === today) acts += '<button type="button" class="btn sec" data-act="cr-start">' + I.hours + 'Cronometro</button>';
        if (my.length && !conf && !future) acts += '<button type="button" class="btn sec" data-act="conf-day" data-d="' + day + '">' + I.check + 'Conferma giornata</button>';
      }
      var state = conf ? '<span class="pill ok">Giornata confermata</span>' + (changed(myAll) ? ' <span class="pill soon">con modifiche</span>' : '')

      h += '<div class="day-sum" style="flex-wrap:wrap"><div><span class="big">' + fmtNum(sumOre(my), 2) + ' <small>h</small></span><span class="cap">' + (my.length ? my.length + (my.length === 1 ? ' mansione segnata da te' : ' mansioni segnate da te') : 'Non hai ancora segnato niente') + '</span>' +
        (state ? '<div style="margin-top:8px">' + state + '</div>' : '') + '</div>' + (acts ? '<div class="feat-acts">' + acts + '</div>' : '') + '</div>';
    }

    var byU = {}, order = [];
    all.forEach(function (l) { if (!byU[l.utente]) { byU[l.utente] = []; order.push(l.utente); } byU[l.utente].push(l); });
    order.sort(byPerson);
    h += secH('Squadra' + (order.length ? ' (' + order.length + ')' : ''));
    if (!order.length) h += emptyCard(I.clip, 'Nessuna mansione per questo giorno', 'Ogni dipendente segna qui cosa ha fatto, su quale barca e per quante ore. Le mansioni finiscono anche nello storico della barca.', S.myId ? ['new-entry', 'Aggiungi mansione'] : null);
    else order.forEach(function (uid) {
      var list = byU[uid].slice().sort(function (a, b) { return String(a.creato || '').localeCompare(String(b.creato || '')); });
      var cf = isConfirmed(uid, day);
      var pill = cf ? '<span class="pill ok">' + (changed(list) ? 'Confermata · modificata' : 'Confermata') + '</span>'

      h += '<div class="person"><div class="person-h">' + avatar(uid) + '<span class="title">' + esc(nameOf(uid)) + '</span>' + pill + '<span class="tot">' + esc(fmtH(sumOre(list))) + '</span></div><div class="group">' + list.map(entryRow).join('') + '</div></div>';
    });
    var openOps = S.ops.filter(function (o) { return !opDone(o); });
    if (openOps.length) h += secH('Servizi aperti (' + openOps.length + ')', 'tab', 'Vedi tutti', ' data-tab="operazioni"') + '<div class="group">' + openOps.map(function (o) { return opRow(o, true); }).join('') + '</div>';

    var ws = mondayOf(day), wdays = [], wk = {}, people = [];
    for (var k = 0; k < 7; k++) wdays.push(utcToISO(ws + k * 86400000));
    S.lavori.forEach(function (l) {
      if (l.fonte !== 'scheda' || !l.utente || !l.data || l.data < wdays[0] || l.data > wdays[6]) return;
      if (!wk[l.utente]) { wk[l.utente] = {}; people.push(l.utente); }

    });
    if (people.length) {
      people.sort(byPerson);

      h += secH('Settimana ' + a.getUTCDate() + (a.getUTCMonth() !== b.getUTCMonth() ? ' ' + MESI[a.getUTCMonth()] : '') + '–' + b.getUTCDate() + ' ' + MESI[b.getUTCMonth()]);
      h += '<div class="group"><div class="wk"><span></span>' + wdays.map(function (iso, i) { return '<span class="hd' + (iso === day ? ' on' : '') + '">' + 'LMMGVSD'.charAt(i) + '</span>'; }).join('') + '<span class="hd" style="text-align:right">Tot.</span>';
      people.forEach(function (uid) {
        var tot = 0;
        h += '<span class="nm">' + esc(nameOf(uid)) + '</span>' + wdays.map(function (iso) {
          var v = wk[uid][iso] || 0; tot += v;
          return '<button type="button" class="c' + (v ? '' : ' z') + (iso === day ? ' sel' : '') + '" data-act="sd-day" data-d="' + iso + '" aria-label="' + esc(fmtDayLong(iso)) + '">' + (v ? fmtNum(v, 1) : '–') + '</button>';
        }).join('') + '<span class="t">' + fmtNum(tot, 1) + ' h</span>';
      });
      h += '</div></div>';
    }
    return h;
  }

  /* ---------- Cronometro sulla mansione ----------
     Si avvia su una barca e il tempo corre anche ad app chiusa. Un documento per persona in «cronometri» (id = chi lo usa):
     fermato = inizio vuoto. Con «Fine» apre la mansione già compilata, con le ore arrotondate alla mezz'ora. */
  var CR_DIMENTICATO = 9; // ore: oltre, l'app chiede a che ora si è finito
  function crMine() { var c = S.myId && (S.crono || {})[S.myId]; return c && c.inizio ? c : null; }
  function crMs(c, fine) { var b = fine != null ? fine : c.pausaDa ? Date.parse(c.pausaDa) : Date.now(); return Math.max(0, b - Date.parse(c.inizio) - (num(c.pausaMs) || 0)); }
  function crClock(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
  function crHm(ms) { var m = Math.round(ms / 60000); return Math.floor(m / 60) + ':' + pad(m % 60); }
  function crOre(ms) { return Math.max(0.5, Math.round(ms / 1800000) / 2); } // alla mezz'ora, almeno mezz'ora
  function crOra(iso) { var d = new Date(iso); return isNaN(d) ? '' : pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function crGiorno(iso) { var d = new Date(iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function crDove(c) { var b = c.barcaId && boatById(c.barcaId); return b ? (b.nome || 'Barca') + (b.posto ? ' · ' + b.posto : '') : 'Lavori di cantiere'; }
  function crDa(c) { var g = crGiorno(c.inizio); return (g === todayISO() ? 'oggi' : g === addDays(todayISO(), -1) ? 'ieri' : fmtDayLong(g)) + ' alle ' + crOra(c.inizio); }
  function crDimenticato(c) { return !!c && (crGiorno(c.inizio) < todayISO() || crMs(c) > CR_DIMENTICATO * 3600000); }
  function crCard(c) {
    var p = !!c.pausaDa;
    return '<div class="feat-card cr-card"><span class="cap"><span class="cr-dot' + (p ? ' p' : '') + '"></span>' + (p ? 'In pausa · avviato ' : 'Cronometro avviato ') + esc(crDa(c)) + '</span>' +
      '<div><div class="feat-title">' + esc(crDove(c)) + '</div>' + (c.titolo ? '<div class="feat-sub">' + esc(c.titolo) + '</div>' : '') + '</div>' +
      '<div class="cr-t">' + crClock(crMs(c)) + '</div>' +
      (crDimenticato(c) ? '<p class="cap t-soon" style="margin:0">È acceso da molto: con «Fine» scegli tu a che ora hai smesso.</p>' : '') +
      '<div class="grid2"><button type="button" class="btn sec" data-act="' + (p ? 'cr-riprendi' : 'cr-pausa') + '">' + (p ? 'Riprendi' : 'Pausa') + '</button><button type="button" class="btn" data-act="cr-fine">Fine</button></div>' +
      (crDimenticato(c) ? '' : '<button type="button" class="btn sec" data-act="cr-cambia">' + I.boat + 'Cambia barca</button>') +
      '<button type="button" class="link self-start" data-act="cr-annulla">Annulla il cronometro</button></div>';
  }
  setInterval(function () {
    var c = crMine(); if (!c || c.pausaDa) return;
    Array.prototype.forEach.call(document.querySelectorAll('.cr-t'), function (el) { el.textContent = crClock(crMs(c)); });
  }, 1000);
  function crBoatSel(presetBoat, tranne) { // tranne: la barca su cui corre già (per «Cambia barca»), '' = lavori di cantiere
    var boats = S.boats.filter(function (b) { return b.id !== tranne; }).sort(byName);
    return '<select id="f-barcaE" required><option value="" disabled' + (presetBoat ? '' : ' selected') + '>Scegli la barca</option>' +
      boats.map(function (b) { return '<option value="' + esc(b.id) + '"' + (b.id === presetBoat ? ' selected' : '') + '>' + esc(boatLabel(b)) + '</option>'; }).join('') +
      (tranne === '' ? '' : '<option value="__cantiere">Lavori di cantiere (nessuna barca)</option>') + '</select>';
  }
  function crStartSheet(presetBoat) {
    if (!S.myId) { toast('Accedi con il tuo account per usare il cronometro.', true); return; }
    var sel = crBoatSel(presetBoat);
    openSheet({
      title: 'Avvia cronometro', submitLabel: 'Avvia',
      body: '<p class="context">Il tempo corre anche se chiudi l’app. Con «Fine» diventa una mansione della tua scheda, con le ore arrotondate alla mezz’ora: la controlli prima di salvarla.</p>' +
        field(lab('f-barcaE', 'Barca'), sel) + field(lab('f-crT', 'Cosa stai facendo (facoltativo)'), inp('f-crT', '', 'type="text" placeholder="es. carteggiatura carena"')),
      onSubmit: async function (f) {
        var bv = val(f, 'f-barcaE'); if (!bv) { formErr('Scegli la barca, oppure «Lavori di cantiere».'); return false; }
        var now = new Date().toISOString(), r = S.db.collection('cronometri').doc(S.myId);
        var ok = await w(function () { return r.set({ utente: S.myId, barcaId: bv === '__cantiere' ? '' : bv, titolo: val(f, 'f-crT'), inizio: now, pausaDa: null, pausaMs: 0, modificato: now }); });
        if (ok) { toast('Cronometro avviato'); render(); }
        return ok;
      }
    });
  }
  async function crPausa(on) {
    var c = crMine(); if (!c || !!c.pausaDa === on) return;
    var now = new Date().toISOString(), u = on ? { pausaDa: now } : { pausaDa: null, pausaMs: (num(c.pausaMs) || 0) + Math.max(0, Date.now() - Date.parse(c.pausaDa)) };
    u.modificato = now;
    if (await w(function () { return S.db.collection('cronometri').doc(S.myId).update(u); })) render();
  }
  function crCambia() { // chiude il cronometro su questa barca (mansione già compilata) e lo riavvia subito su un'altra
    var c = crMine(); if (!c) return;
    if (crDimenticato(c)) { crFine(); return; }
    openSheet({
      title: 'Cambia barca', submitLabel: 'Avanti',
      body: '<p class="context">Adesso: ' + esc(crDove(c)) + (c.titolo ? ' · ' + esc(c.titolo) : '') + ', ' + crHm(crMs(c)) + ' di lavoro. Si apre la mansione già compilata: quando la salvi, il cronometro riparte da questo momento sulla nuova barca.</p>' +
        field(lab('f-barcaE', 'Nuova barca'), crBoatSel('', c.barcaId || '')) + field(lab('f-crT', 'Cosa fai sulla nuova barca (facoltativo)'), inp('f-crT', '', 'type="text" placeholder="es. lucidatura"')),
      onSubmit: function (f) {
        var bv = val(f, 'f-barcaE'); if (!bv) { formErr('Scegli la nuova barca.'); return false; }
        var t = Date.now(), fine = c.pausaDa ? Date.parse(c.pausaDa) : t;
        var nx = { utente: S.myId, barcaId: bv === '__cantiere' ? '' : bv, titolo: val(f, 'f-crT'), inizio: new Date(t).toISOString(), pausaDa: null, pausaMs: 0 };
        setTimeout(function () { crToScheda(c, fine, nx); }, 0);
        return true;
      }
    });
  }
  function crStop() { return S.db.collection('cronometri').doc(S.myId).set({ utente: S.myId, inizio: null, modificato: new Date().toISOString() }); }
  function crAnnulla() {
    var c = crMine(); if (!c) return;
    openSheet({ title: 'Annulla il cronometro', submitLabel: 'Annulla', body: '<p class="context">' + esc(crDove(c)) + (c.titolo ? ' · ' + esc(c.titolo) : '') + ', avviato ' + esc(crDa(c)) + '. Il tempo segnato (' + crHm(crMs(c)) + ') non diventa una mansione.</p>',
      onSubmit: async function () { var ok = await w(crStop); if (ok) { toast('Cronometro annullato'); render(); } return ok; } });
  }
  function crFine() {
    var c = crMine(); if (!c) return;
    if (crDimenticato(c)) crFineOraSheet(c);
    else crToScheda(c, c.pausaDa ? Date.parse(c.pausaDa) : Date.now());
  }
  function crToScheda(c, fineT, nx) { // nx: il cronometro che riparte su un'altra barca dopo il salvataggio («Cambia barca»)
    var ms = crMs(c, fineT), pz = num(c.pausaMs) || 0;
    var nota = 'Cronometro: dalle ' + crOra(c.inizio) + ' alle ' + crOra(new Date(fineT).toISOString()) + (pz >= 60000 ? ', con ' + crHm(pz) + ' di pausa' : '') +
      ': ' + crHm(ms) + ' di lavoro. Le ore sono arrotondate alla mezz’ora: controlla e salva.' +
      (nx ? ' Quando salvi, il cronometro riparte su ' + crDove(nx) + ' dalle ' + crOra(nx.inizio) + '.' : '');
    schedaSheet(null, { data: crGiorno(c.inizio), barcaId: c.barcaId || '__cantiere', titolo: c.titolo || '', oreLavoro: crOre(ms) }, { nota: nota, after: function () {
      if (!nx) return w(crStop);
      return w(function () { return S.db.collection('cronometri').doc(S.myId).set(Object.assign({}, nx, { modificato: new Date().toISOString() })); });
    } });
  }
  function crFineOraSheet(c) {
    var g = crGiorno(c.inizio);
    openSheet({
      title: 'A che ora hai finito?', submitLabel: 'Avanti',
      body: '<p class="context">' + esc(crDove(c)) + (c.titolo ? ' · ' + esc(c.titolo) : '') + ', avviato ' + esc(crDa(c)) + '.</p>' +
        field(lab('f-crF', 'Ora di fine, ' + fmtDayLong(g)), inp('f-crF', '', 'type="time" required')),
      onSubmit: function (f) {
        var m = /^(\d{1,2}):(\d{2})/.exec(val(f, 'f-crF')); if (!m) { formErr('Scegli l’ora in cui hai smesso.'); return false; }
        var d = new Date(c.inizio); d.setHours(+m[1], +m[2], 0, 0);
        var t = d.getTime(), lim = c.pausaDa ? Date.parse(c.pausaDa) : Date.now();
        if (t <= Date.parse(c.inizio)) { formErr('L’ora di fine deve venire dopo l’inizio (' + crOra(c.inizio) + ').'); return false; }
        if (t > lim) t = lim;
        setTimeout(function () { crToScheda(c, t); }, 0);

      }

  }
  function crHome() { // la scheda in Home: in corso oppure dimenticato
    var c = crMine(); if (!c) return '';
    if (crDimenticato(c)) return featCard('soon', I.hours, 'Cronometro acceso da ' + fmtNum(Math.floor(crMs(c) / 3600000)) + ' ore', crDove(c) + (c.titolo ? ' · ' + c.titolo : '') + ', avviato ' + crDa(c) + '. A che ora hai finito?', '',
      '<button type="button" class="btn" data-act="cr-fine">Segna l’ora di fine</button><button type="button" class="btn sec" data-act="cr-annulla">Annulla</button>');
    return featCard('', I.hours, c.pausaDa ? 'Cronometro in pausa' : 'Cronometro in corso', crDove(c) + (c.titolo ? ' · ' + c.titolo : ''), '<div class="feat-status cr-t">' + crClock(crMs(c)) + '</div>',
      '<button type="button" class="btn" data-act="cr-fine">Fine</button><button type="button" class="btn sec" data-act="go-scheda">Scheda lavoro</button>');
  }

  /* ---------- Lavori dati fuori: lavorazioni affidate a una ditta esterna (velaio, tappezziere, elettricista…) ----------
     Nella lavorazione: fuori = { ditta, tel, cosa, uscito, rientro, rientrato }. Le ditte si possono preparare in «ditte»
     (nome, cosa fanno, referente, telefono, email, note); quelle solo scritte in una lavorazione l'app le ricorda lo stesso. */
  function lfAperto(l) { return !!(l && l.fuori && l.fuori.ditta && !l.fuori.rientrato && l.stato !== 'fatto' && l.fonte !== 'scheda'); }
  function lfList() { return S.lavori.filter(lfAperto).sort(function (a, b) { return String(a.fuori.rientro || '9999').localeCompare(String(b.fuori.rientro || '9999')); }); }
  function lfLate(l) { return lfAperto(l) && !!l.fuori.rientro && l.fuori.rientro < todayISO(); }
  function lfKey(n) { return String(n || '').trim().toLowerCase(); }
  function lfDitte() { // le ditte dell'elenco, più nomi e telefoni già usati nelle lavorazioni, per non riscriverli
    var m = {};
    (S.ditte || []).forEach(function (d) { var k = lfKey(d.nome); if (k) m[k] = Object.assign({}, d, { nome: String(d.nome).trim(), tel: d.tel || '', t: '~', elenco: true }); });
    S.lavori.forEach(function (l) {
      var f = l.fuori; if (!f || !f.ditta) return;
      var k = lfKey(f.ditta), t = String(l.modificato || '');
      if (!m[k]) m[k] = { nome: String(f.ditta).trim(), tel: '', t: '' };
      if (f.tel && t >= m[k].t) { m[k].tel = f.tel; m[k].t = t; }
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return a.nome.localeCompare(b.nome, 'it'); });
  }
  function lfDitta(nome) { var k = lfKey(nome); return k ? lfDitte().find(function (d) { return lfKey(d.nome) === k; }) || null : null; }
  function lfWhen(l) {
    var r = l.fuori.rientro; if (!r) return { lv: '', t: 'Senza data di rientro' };
    var d = daysUntil(r);
    if (d < 0) return { lv: 'late', t: 'Doveva tornare ' + fmtDayLong(r) + ' · ' + (-d) + (d === -1 ? ' giorno' : ' giorni') + ' di ritardo' };
    if (d === 0) return { lv: 'soon', t: 'Rientro previsto oggi' };
    if (d === 1) return { lv: 'soon', t: 'Rientro previsto domani' };
    return { lv: '', t: 'Rientro previsto ' + fmtDayLong(r) };
  }
  function lfTel(t) { return String(t || '').replace(/[^\d+]/g, ''); }
  function lfWa(tel, txt) { var n = lfTel(tel).replace(/^\+/, '').replace(/^00/, ''); if (n.length <= 10) n = '39' + n; return 'https://wa.me/' + n + '?text=' + encodeURIComponent(txt); }
  function lfMail(d, txt) { return 'mailto:' + encodeURIComponent(String(d.email || '').trim()).replace(/%40/g, '@') + '?subject=' + encodeURIComponent(NOME() + ': lavori in corso') + '&body=' + encodeURIComponent((d.referente ? 'Gentile ' + d.referente + ',\n' : '') + txt); }
  function lfMsg(ls) {
    return 'Buongiorno, siamo ' + NOME() + '. Volevamo sapere a che punto ' + (ls.length === 1 ? 'è il lavoro: ' : 'sono i lavori: ') +
      ls.map(function (l) { var b = boatById(l.barcaId); return (l.fuori.cosa || l.titolo || 'lavoro') + (b ? ' (barca ' + (b.nome || '') + ')' : ''); }).join('; ') + '. Grazie!';
  }
  function lfBlock(f) {
    f = f || {}; var on = !!f.ditta;
    return field(lab('f-chi', 'Chi lo fa'), '<select id="f-chi">' + opts([['', 'Noi, in cantiere'], ['fuori', 'Una ditta esterna (velaio, tappezziere…)']], on ? 'fuori' : '') + '</select>') +
      '<div id="f-lfW" class="lf-w"' + (on ? '' : ' hidden') + '>' +
      '<datalist id="lf-ditte">' + lfDitte().map(function (d) { return '<option value="' + esc(d.nome) + '"' + (d.cosa ? ' label="' + esc(d.cosa) + '"' : '') + '>'; }).join('') + '</datalist>' +
      '<div class="grid2">' + field(lab('f-lfD', 'Ditta'), inp('f-lfD', f.ditta, 'type="text" list="lf-ditte" autocapitalize="words" placeholder="es. Velaria Rossi"')) +
      field(lab('f-lfT', 'Telefono'), inp('f-lfT', f.tel, 'type="tel" placeholder="es. 333 1234567"')) + '</div>' +
      field(lab('f-lfC', 'Cosa è uscito dal cantiere'), inp('f-lfC', f.cosa, 'type="text" placeholder="es. 2 cuscini prendisole, tendalino"')) +
      '<div class="grid2">' + field(lab('f-lfU', 'Portato via il'), inp('f-lfU', f.uscito || todayISO(), 'type="date"')) + field(lab('f-lfR', 'Rientro previsto'), inp('f-lfR', f.rientro, 'type="date"')) + '</div>' +
      (on ? field(lab('f-lfE', 'Rientrato il'), inp('f-lfE', f.rientrato, 'type="date"'), 'Lascialo vuoto finché è ancora dalla ditta.') : '') + '</div>';

  function giroElenco() {

  var PREV_STATI = [['bozza', 'Da inviare'], ['inviato', 'Inviato'], ['accettato', 'Accettato'], ['rifiutato', 'Rifiutato']];

  function prevStato(k) { var x = PREV_STATI.find(function (s) { return s[0] === k; }); return x ? x[1] : 'Da inviare'; }
  function prevOre(p) { var t = 0; (p.voci || []).forEach(function (v) { t += num(v.ore) || 0; }); return t; }

    var st = '<span class="pill ' + (PREV_PILL[p.stato] || '') + '">' + esc(prevStato(p.stato)) + '</span>';
    if (c && c.tot) st += ' <span class="pill' + (c.fatti === c.tot ? ' ok' : '') + '">' + c.fatti + '/' + c.tot + ' lavori fatti</span>' + (c.fatti ? ' <span class="pill ' + (c.vere > c.prev * 1.1 ? 'late' : 'ok') + '">' + esc(fmtH(c.vere)) + ' su ' + esc(fmtH(c.prev)) + ' previste</span>' : '');

  function prevOfBoat(bid) { return (S.prev || []).filter(function (p) { return p.barcaId === bid; }).sort(function (a, c) { return String(c.data || '').localeCompare(String(a.data || '')); }); }
  function viewPreventivi() {

        (c && c.tot ? '<div class="lbl">Ore previste e ore vere</div><div class="group pan">' + lavs.map(function (l) {

          else if (a.getAttribute('data-act') === 'pv-del') { e.stopPropagation(); var row = a.closest('.pv-row'); if (f.querySelectorAll('.pv-row').length > 1) row.remove(); else { row.querySelector('.pv-t').value = ''; row.querySelector('.pv-o').value = ''; } tot(); }

  /* ---------- Scadenze del cantiere: mezzi, attrezzature e sicurezza, separate da quelle delle barche ---------- */
  var SC_GRUPPI = [['mezzi', 'Mezzi e attrezzature'], ['sicurezza', 'Sicurezza del cantiere']];

  function scGruppo(k) { var g = SC_GRUPPI.find(function (x) { return x[0] === k; }); return g ? g[1] : 'Cantiere'; }

  function viewScadCantiere() {

  // Dopo una mansione o una lavorazione: «metto i vecchi nei rifiuti?»
  var RIF_GUESS = [ // per il nome di un ricambio: il primo che corrisponde
    [/filtr\w*\s+(dell'|del |d')?aria/, 'filtri-aria'],
    [/filtr|separatore|prefiltr/, 'filtri-olio'],

    [/bombolett|spray/, 'spray'],
    [/estintor/, 'estintori'],
    [/\bolio\b/, 'olio']
  ];
  function rifGuess(txt) { txt = String(txt || '').toLowerCase(); for (var i = 0; i < RIF_GUESS.length; i++) if (RIF_GUESS[i][0].test(txt)) return RIF_GUESS[i][1]; return null; }
  function rifGuessTitle(txt) { // per il titolo di un lavoro: tutti quelli che c'entrano, solo se si è tolto o cambiato qualcosa
    txt = String(txt || '').toLowerCase(); if (!/sostitu|cambi|tagliand|rimoss|smontat|nuov|scaric|svuot/.test(txt)) return [];

    if (/tagliand/.test(txt) || /\bolio\b/.test(txt)) out.push('olio');
    if (/tagliand/.test(txt) || (/filtr/.test(txt) && !/filtr\w*\s+(dell'|del |d')?aria/.test(txt))) out.push('filtri-olio');
    if (/filtr\w*\s+(dell'|del |d')?aria/.test(txt)) out.push('filtri-aria');
    [[/batteri/, 'batterie'], [/\banod|zinc/, 'zinco'], [/candel/, 'candele'], [/antigelo|refrigerante/, 'antigelo'], [/estintor/, 'estintori']].forEach(function (r) { if (r[0].test(txt)) out.push(r[1]); });

  /* ---------- Spazio nel database e foto (solo amministratore, sito con Firebase) ----------

     Il lavoro vero lo fa nm-fb.js (window.__NM_FB.foto). */
  var FS = { info: null, carico: false, busy: '', prog: '', lista: null, parti: null };
  function fsMB(mb) { return mb >= 1000 ? fmtNum(mb / 1024, 2) + ' GB' : mb >= 10 ? fmtNum(Math.round(mb)) + ' MB' : fmtNum(mb, 1) + ' MB'; }
  function fsCarica() {

      '<div class="acts" style="margin-top:8px"><button type="button" class="btn sec" data-act="fs-conta"' + (FS.busy ? ' disabled' : '') + '>' + (FS.busy === 'conta' ? esc(FS.prog || 'Conto le foto…') : ct ? 'Conta di nuovo le foto' : 'Conta le foto') + '</button></div>' +

        '<p>Non sono in nessuna barca, lavoro, scadenza o voce del cestino. Le foto degli ultimi 2 giorni restano comunque.</p>' +
        '<div class="acts"><button type="button" class="btn danger-ghost" data-act="fs-togli">' + I.trash + 'Togli per sempre</button></div><p class="cap" style="margin:6px 0 0">Non si possono recuperare: se vuoi tenerle, prima scarica il file con tutte le foto qui sotto.</p></div>';

  }
  function fsErr(e) { FS.busy = ''; FS.prog = ''; render(); toast(e && e.code === 'non_pronto' ? 'I dati non sono ancora tutti caricati: riprova tra poco.' : 'Non è andata: controlla la rete e riprova.', true); }
  function fsProg(t) { FS.prog = t; if (V.tab === 'backup') render(); }
  function fsAzione(k, i) {
    var F = window.__NM_FB && window.__NM_FB.foto; if (!F || !S.isOwner || (FS.busy && k !== 'salva')) return;
    if (k === 'conta') {
      FS.busy = 'conta'; render();
      F.conta(function (n, mb) { fsProg('Conto le foto: ' + fmtNum(n) + ' · ' + fsMB(mb) + '…'); }).then(function () { FS.busy = ''; FS.prog = ''; FS.carico = false; FS.info = null; render(); toast('Foto contate'); }, fsErr);
    } else if (k === 'cerca') {
      FS.busy = 'cerca'; render();
      F.nonUsate().then(function (l) { FS.busy = ''; FS.lista = l; render(); }, fsErr);
    } else if (k === 'togli') {
      var l = FS.lista || []; if (!l.length) return;
      if (!confirm('Tolgo per sempre ' + l.length + (l.length === 1 ? ' foto' : ' foto') + '? Non si potranno recuperare.')) return;
      FS.busy = 'togli'; render();
      F.pulisci(l, function (a, n) { fsProg('Tolgo le foto: ' + a + ' di ' + n + '…'); }).then(function (n) { FS.busy = ''; FS.prog = ''; FS.lista = null; FS.carico = false; FS.info = null; render(); toast(n === 1 ? 'Tolta 1 foto' : 'Tolte ' + n + ' foto'); }, fsErr);
    } else if (k === 'file') {
      FS.busy = 'file'; FS.parti = null; render();
      F.file(function (n, mb) { fsProg('Scarico le foto: ' + fmtNum(n) + ' · ' + fsMB(mb) + '…'); }).then(function (p) { FS.busy = ''; FS.prog = ''; FS.parti = p; FS.carico = false; FS.info = null; render(); }, fsErr);
    } else if (k === 'salva') {
      var p = FS.parti && FS.parti[i]; if (!p) return;
      F.salva(p).then(function (r) { if (r && r.status === 'saved') toast('File salvato'); }, function (e) { if (!(e && e.code === 'declined')) toast('Non è andata. Riprova.', true); });
    }
  }

  async function bkSave() {
    if (BK.busy || !S.db || S.status !== 'ready') return;
    if (S.dl === undefined) { try { S.dl = (await CLD().use('downloads')) || null; } catch (e) { S.dl = null; } }
    if (!S.dl) { render(); toast('Da qui non si possono scaricare file: apri l’app da claude.ai o dall’app Claude.', true); return; }
    BK.busy = 'save'; render();
    var coll = {}, tot = 0, conteggi = {};
    try {
      for (var i = 0; i < BK_COLL.length; i++) {
        var name = BK_COLL[i][0], snap = await bkGet(name), m = {}, n = 0;
        snap.docs.forEach(function (d) {
          if (d.exists === false || (name === 'impostazioni' && d.id === 'backup')) return;
          m[d.id] = d.data(); n++;
        });
        coll[name] = m; conteggi[name] = n; tot += n;
      }
    } catch (e) {
      BK.busy = false; render(); toast('Copia non riuscita: controlla la connessione e riprova.', true); return;
    }
    var now = new Date(), chi = S.myId ? nameOf(S.myId) : '';
    if (chi === 'Tu' || chi === 'Dipendente') chi = '';
    var file = { app: 'Gestionale cantiere', tipo: 'Copia dei dati', formato: 1, creata: now.toISOString(), creataDa: chi, voci: tot, conteggi: conteggi, collezioni: coll };
    var fn = (NOME().replace(/[^A-Za-z0-9-]+/g, '') || 'Gestionale') + '-copia-' + localISO(now) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.json';
    try {
      var res = await S.dl.save({ filename: fn, data: JSON.stringify(file, null, 1) });
      if (res && res.status === 'saved') {
        toast('Copia pronta: ' + nVoci(tot));
        try { await S.db.collection('impostazioni').doc('backup').set({ ultima: now.toISOString(), da: S.myId || '', nome: chi, voci: tot }); } catch (e) { }
      }
    } catch (e) { bkDlErr(e && e.code); }
    BK.busy = false; render();
  }

  function bkItem(name, d, src) {
    var t = d.nome || d.titolo || d.tipo || '';
    if (name === 'conferme' || name === 'dipendenti') t = d.nome || (d.utente ? nameOf(d.utente) : '');
    var bid = d.barcaId, bn = '';
    if (bid) { var b = boatById(bid) || (isObj(src.barche) && isObj(src.barche[bid]) ? src.barche[bid] : null); bn = b && b.nome ? b.nome : ''; }
    var s = [t, bn].filter(Boolean).join(' · ');
    if (d.data && /^\d{4}-\d{2}-\d{2}$/.test(d.data)) s += (s ? ' ' : '') + '(' + fmtDate(d.data) + ')';
    return s;
  }

  async function bkPick(f) {
    if (!f || BK.busy || !S.db || S.status !== 'ready') return;
    if (f.size > 40 * 1024 * 1024) { toast('Questo file non è una copia dei dati del gestionale.', true); return; }
    var txt = null, data = null;
    try { txt = await f.text(); } catch (e) { toast('Non riesco a leggere il file.', true); return; }
    try { data = JSON.parse(String(txt).replace(/^﻿/, '')); } catch (e) { data = null; }
    if (!isObj(data) || (data.app !== 'Gestionale cantiere' && data.app !== 'Nautica Mare') || !isObj(data.collezioni)) { toast('Questo file non è una copia dei dati del gestionale.', true); return; }
    BK.busy = 'check'; render();
    var miss = {}, tot = 0, all = 0;
    try {
      for (var i = 0; i < BK_COLL.length; i++) {
        var name = BK_COLL[i][0], src = data.collezioni[name];
        if (!isObj(src)) continue;
        var ids = Object.keys(src).filter(function (id) {
          return BK_ID.test(id) && id !== '.' && id !== '..' && isObj(src[id]) && !(name === 'impostazioni' && id !== 'mappa');
        });
        all += ids.length;
        if (!ids.length) continue;
        var snap = await bkGet(name), have = {};
        snap.docs.forEach(function (d) { if (d.exists !== false) have[d.id] = 1; });
        var list = ids.filter(function (id) { return !have[id]; });
        if (list.length) { miss[name] = list; tot += list.length; }
      }
    } catch (e) {
      BK.busy = false; render(); toast('Controllo non riuscito: controlla la connessione e riprova.', true); return;
    }
    BK.busy = false; render();
    BK.src = data; BK.miss = miss;
    var head = '<p class="cap" style="margin:0">' + (data.creata ? 'Copia del ' + esc(fmtWhen(data.creata)) : 'Copia senza data') + (data.creataDa ? ' · fatta da ' + esc(data.creataDa) : '') + ' · ' + nVoci(all) + '</p>';
    if (!tot) {
      openSheet({ title: 'Ripristino', menu: true, body: head + '<div class="notice" style="margin-top:12px">Nell’app c’è già tutto quello che contiene questa copia: non c’è niente da recuperare.</div>' });
      return;
    }
    var rows = BK_COLL.filter(function (x) { return miss[x[0]]; }).map(function (x) {
      var name = x[0], ids = miss[name], ex = [];
      for (var k = 0; k < ids.length && ex.length < 3; k++) { var s = bkItem(name, data.collezioni[name][ids[k]], data.collezioni); if (s) ex.push(s); }
      var more = ids.length - ex.length;
      var sub = ex.length ? esc(ex.join(', ')) + (more > 0 ? ' e ' + fmtNum(more) + ' in più' : '') : '';
      return '<div class="ck"><label><input type="checkbox" data-rs="' + esc(name) + '" checked><span class="t"><b>' + esc(x[1]) + '</b> · ' + fmtNum(ids.length) +
        (sub ? '<span class="cap" style="display:block;margin-top:2px">' + sub + '</span>' : '') + '</span></label></div>';
    });
    openSheet({
      title: 'Ripristino', submitLabel: 'Recupera',
      body: head + '<p style="margin:12px 2px 8px">Nell’app ' + (tot === 1 ? 'manca <b>1 voce</b> che è nella copia' : 'mancano <b>' + nVoci(tot) + '</b> che sono nella copia') + '. Scegli cosa rimettere:</p><div class="group">' + rows.join('') + '</div>' +
        '<p class="cap" style="margin:10px 2px 0">Quello che c’è già nell’app non viene toccato, anche se è stato modificato dopo la copia.</p><p class="cap" id="rs-prog" style="margin:10px 2px 0;color:var(--accent)" hidden></p>',
      onSubmit: async function (form) {
        var names = Array.prototype.map.call(form.querySelectorAll('input[data-rs]:checked'), function (x) { return x.getAttribute('data-rs'); });
        if (!names.length) { formErr('Scegli almeno una voce da recuperare.'); return false; }
        Array.prototype.forEach.call(form.querySelectorAll('input[data-rs]'), function (x) { x.disabled = true; });
        BK.busy = 'restore'; render();
        var r = await bkRestore(names, function (k, n) { var p = $('#rs-prog'); if (p) { p.hidden = false; p.textContent = 'Recupero ' + fmtNum(k) + ' di ' + fmtNum(n) + '…'; } });
        BK.busy = false; BK.src = null; BK.miss = null; render();
        if (r.stop === 'quota_exceeded') toast('Spazio dati esaurito: recuperate ' + nVoci(r.done) + '.', true);
        else if (r.stop) toast('Accesso ai dati non più disponibile: recuperate ' + nVoci(r.done) + '. Ricarica la pagina.', true);
        else if (r.fail) toast('Recuperate ' + nVoci(r.done) + ', ' + fmtNum(r.fail) + ' non riuscite: riprova con lo stesso file.', true);
        else if (!r.done) toast('Era già tutto presente nell’app');
        else toast('Recuperate ' + nVoci(r.done));
        return true;
      }
    });
  }

  async function bkRestore(names, prog) {
    var r = { done: 0, skip: 0, fail: 0, stop: null }, n = 0, k = 0;
    names.forEach(function (nm) { n += (BK.miss[nm] || []).length; });
    outer:
    for (var i = 0; i < names.length; i++) {
      var name = names[i], ids = BK.miss[name] || [], src = BK.src.collezioni[name];
      for (var j = 0; j < ids.length; j++) {
        k++; prog(k, n);
        var ref = S.db.collection(name).doc(ids[j]), ok = false, code = null;
        for (var a = 0; a < 3 && !ok; a++) {
          try {
            var cur = await ref.get();
            if (cur.exists) { r.skip++; ok = true; break; }
            await ref.set(src[ids[j]]); r.done++; ok = true;
          } catch (e) {
            code = e && e.code;
            if (code === 'unavailable' || code === 'resource_exhausted') { await wait(800 * (a + 1) + Math.random() * 600); continue; }
            break;
          }
        }
        if (!ok) {
          r.fail++;
          if (code === 'quota_exceeded' || code === 'revoked' || code === 'not_granted') { r.stop = code; break outer; }
        }
      }
    }
    return r;
  }

  function viewVari() {
    if (!S.boats.length) return '<div style="margin-top:14px">' + emptyCard(I.boat, 'Prima aggiungi una barca', 'Vari e alaggi sono collegati a una barca.', ['new-boat', 'Aggiungi barca']) + '</div>';

        inpq.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { V.gq = inpq.value; res.innerHTML = gqResults(V.gq); }, 120); });
        inpq.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
        setTimeout(function () { inpq.focus(); inpq.select(); }, 60);
      } });
  }
  function gqGo(k, id) {
    var x;
    closeSheet();
    if (k === 'boat') { V.tab = 'barche'; V.boatId = id; V.boatView = null; V.boatLavAll = false; render(); window.scrollTo(0, 0); }
    else if (k === 'mag') { x = S.mag.find(function (m) { return m.id === id; }); if (x && S.canWrite) magSheet(x); else { V.tab = 'magazzino'; V.boatId = null; V.magQ = x ? x.nome : ''; render(); } }
    else if (k === 'lav') {
      x = S.lavori.find(function (l) { return l.id === id; }); if (!x) return;
      if (x.fonte === 'scheda' ? canEditEntry(x) : S.canWrite) { if (x.fonte === 'scheda') schedaSheet(x); else lavSheet(x); }
      else if (x.barcaId) gqGo('boat', x.barcaId);
    }
    else if (k === 'scad') { x = S.scadenze.find(function (s) { return s.id === id; }); if (x) scadSheet(x); }
    else if (k === 'scc') { x = (S.scadC || []).find(function (s) { return s.id === id; }); if (x && S.canWrite) scSheet(x); else { V.tab = 'scadcantiere'; V.boatId = null; render(); } }
    else if (k === 'prev') { x = (S.prev || []).find(function (p) { return p.id === id; }); if (x && S.canWrite) prevSheet(x); else { V.tab = 'preventivi'; V.boatId = null; render(); } }
    else if (k === 'attr') { x = (S.attr || []).find(function (a) { return a.id === id; }); if (x && S.canWrite) attrSheet(x); else if (x && x.barcaId) gqGo('boat', x.barcaId); }
  }

    scheda: { t: 'Scheda lavoro', p: 'Il rapportino del giorno: ognuno segna cosa ha fatto e per quante ore.', li: [

    lavori: { t: 'Lavorazioni', p: 'L’elenco dei lavori da fare sulle barche. La Scheda lavoro dice «cosa ho fatto oggi», le Lavorazioni «cosa c’è da fare».', li: [

    calendario: { t: 'Calendario', p: 'Il mese o la settimana a vista: in alto scegli «Mese» o «Settimana» (l’app si ricorda la scelta).', li: [

    riepiloghi: { t: 'Riepiloghi', p: 'I numeri del cantiere in quattro pagine, aggiornati in tempo reale. Su computer e tablet sono nel menù sotto Amministrazione, sul telefono in Altro › Riepiloghi.', li: [

    barca: { t: 'Scheda della barca', p: 'Qui c’è tutta la storia della barca.', li: [

    mappa: { t: 'Mappa del cantiere', p: 'Il piazzale e il capannone in scala, con le barche disegnate con le loro misure.', pL: 'La pianta del vostro cantiere in scala, con le barche disegnate con le loro misure.', li: [

    porto: { t: 'Porto', p: 'I pontili della Marina con i posti barca.', li: [

  /* ---------- Avvio ---------- */
  async function init() {
    render();

      db.collection(name).onSnapshot(function (snap) {

        S.got[name] = true;

        if (name === 'lavori') { resolveNames(); progPulizia(); }

        else toast('Aggiornamento dati interrotto. Ricarica la pagina.', true);

    }
    sub('conferme', function (x) { S.conf = toMap(x); });

    }, function () { });
