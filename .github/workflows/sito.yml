# Sito su Firebase Hosting: pubblica il gestionale su https://kardan.web.app (sito «kardan» del progetto Firebase
# gestionale-rimessaggio, al posto di GitHub Pages, che non si può usare per vendere un servizio in abbonamento).
# Parte solo a mano (Actions › Sito su Firebase › Run workflow), dopo il via esplicito di Torcio, e pubblica il ramo scelto.
# All'account del segreto FIREBASE_SERVICE_ACCOUNT è stato dato il ruolo «Firebase Hosting Admin» (16/11/2026).
# In alternativa si pubblica dal Terminale del Mac: npx firebase-tools deploy --only hosting --project gestionale-rimessaggio
name: Sito su Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pubblica il sito
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo 'Manca il segreto FIREBASE_SERVICE_ACCOUNT.'; exit 1; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/chiave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/chiave.json"
          npx --yes firebase-tools@15.34.2 deploy --only hosting --project gestionale-rimessaggio --non-interactive --message "${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/chiave.json"
