# Copia dei dati automatica: ogni domenica notte salva i dati di TUTTE le aziende (un file per azienda nel
# formato della copia dell'app, più un file con le raccolte comuni; le foto no) in un unico file chiuso con
# password. Il repository è pubblico: per questo esce SOLO cifrato (7-Zip AES-256, nomi dei file nascosti)
# e, se manca la password, la copia si ferma.
# Segreti: FIREBASE_SERVICE_ACCOUNT (già usato dalle notifiche) e COPIA_PASSWORD (da creare in
# Settings › Secrets and variables › Actions). Le copie restano scaricabili 8 settimane in Actions.
name: Copia dei dati automatica

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copia
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Controlla la password
        env:
          COPIA_PASSWORD: ${{ secrets.COPIA_PASSWORD }}
        run: |
          if [ -z "$COPIA_PASSWORD" ]; then
            echo "::error::Manca il segreto COPIA_PASSWORD: la copia non si fa (il file in chiaro non deve uscire)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa
        working-directory: .github/notifiche
        run: npm ci --no-audit --no-fund
      - name: Leggi i dati
        working-directory: .github/notifiche
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p "$RUNNER_TEMP/copia"
          node copia.js "$RUNNER_TEMP/copia"
      - name: Chiudi con la password
        env:
          COPIA_PASSWORD: ${{ secrets.COPIA_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP"
          GIORNO=$(date -u +%Y-%m-%d)
          7z a -t7z -mhe=on -mx=9 -p"$COPIA_PASSWORD" "Gestionale-copia-$GIORNO.7z" ./copia/*.json > /dev/null
          rm -rf ./copia
          mkdir -p uscita && mv "Gestionale-copia-$GIORNO.7z" uscita/
          echo "NOME=Gestionale-copia-$GIORNO" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ runner.temp }}/uscita/*.7z
          retention-days: 56
          if-no-files-found: error
          compression-level: 0
